apis:
- aid: cobot-api
  name: Cobot API
  description: >-
    Version 2.0 of the Cobot API — a JSON:API-conformant REST API over the coworking platform,
    covering spaces and networks, memberships and membership profiles, plans and subscriptions,
    resources and availability, bookings (including recurring, external and admin bookings),
    drop-in passes, events and attendances, check-ins, invoices and invoice reminders, payments
    and refunds, products, teams, contacts and single-page-app add-ons. 134 operations across
    112 paths, every one carrying an operationId and an OAuth 2.0 scope requirement.
  humanURL: https://dev.cobot.me/api2
  baseURL: https://api.cobot.me
