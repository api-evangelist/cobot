- aid: cobot-api-v1
  name: Cobot API v1 (legacy)
  description: >-
    The original Cobot REST API, still available and still the only surface that carries the
    webhook subscription API. Documented per-resource on dev.cobot.me/api-docs; Cobot directs
    new integrations to API 2. No machine-readable specification is published for v1.
  humanURL: https://dev.cobot.me/api-docs
  baseURL: https://www.cobot.me/api
  tags:
  - Coworking
  - Webhooks
  - Legacy
  properties:
  - type: Documentation
    url: https://dev.cobot.me/api-docs
  - type: Webhooks
    url: asyncapi/cobot-webhooks.yml
  - type: ChangeLog
    url: https://www.cobot.me/pages/api_changes
- aid: cobot-mcp
  name: Cobot MCP Server
  description: >-
    A hosted, remote Model Context Protocol server operated by Cobot at api.cobot.me/mcp.
    It is live and OAuth 2.0 protected — an anonymous tools/list returns 401 with an
    RFC 9728 WWW-Authenticate challenge pointing at its own protected-resource metadata,
    which advertises a 14-scope read/write capability surface over spaces, memberships,
    bookings, check-ins, invoices, resources, products, contacts and teams.
  humanURL: https://dev.cobot.me/api2
  baseURL: https://api.cobot.me/mcp
  tags:
  - MCP
