description: >-
  Cobot is coworking and flexible-workspace management software, built and operated by
  Upstream - Agile GmbH in Berlin, Germany. It runs the day-to-day of a coworking space or
  space network from one platform: memberships and plans, resource and meeting-room bookings,
  drop-in passes, events and ticketing, check-ins, automated invoicing and online payments,
  a white-label member portal and mobile app, analytics, and door access-control integrations
  (Kisi, Salto KS, Tapkey, Sensorberg, dormakaba Exivo). Cobot publishes a genuinely open
  developer surface: a 134-operation OpenAPI 3.1 contract for API 2 that follows the JSON:API
  standard, a legacy v1 REST API with a documented webhook event catalog, OAuth 2.0 with
  authorization-code + PKCE and dynamic client registration, OpenID Connect, an RFC 9727
  api-catalog document, RFC 9728 protected-resource metadata, an llms.txt, and an
  OAuth-protected hosted MCP server at api.cobot.me/mcp.
url: https://raw.githubusercontent.com/api-evangelist/cobot/refs/heads/main/apis.yml
