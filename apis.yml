- aid: cobot-mcp
  name: Cobot MCP Server
  description: >-
    A hosted, remote Model Context Protocol server operated by Cobot at api.cobot.me/mcp. It is live and
    OAuth 2.0 protected — an anonymous tools/list returns 401 with an RFC 9728 WWW-Authenticate challenge
    pointing at its own protected-resource metadata, which advertises a 14-scope read/write capability
    surface over spaces, memberships, bookings, check-ins, invoices, resources, products, contacts and
    teams.
  humanURL: https://dev.cobot.me/api2
  baseURL: https://api.cobot.me/mcp
