purpose: >-
  The usual crosswalk binds MCP TOOL -> REST operationId. Cobot's MCP server is OAuth-gated,
  so no tool names are publicly enumerable and none are invented here. What IS published is
  the scope surface, and every scope maps deterministically onto real operations. This file
  therefore crosswalks at the SCOPE level — the strongest binding the public evidence supports.
  Upgrade to a tool-level crosswalk once an authenticated tools/list is captured.
