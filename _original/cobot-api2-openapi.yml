        id:
          type: string
        type:
          type: string
          enum:
            - invoices
        attributes:
          type: object
          required:
            - invoiceDate
            - dueDate
            - eInvoicingReady
            - remindAt
            - number
            - recipientAddress
            - senderAddress
            - items
            - payableAmount
            - paidAmount
            - totalAmount
