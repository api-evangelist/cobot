                            data: null
  /spaces/{spaceId}/allocations:
    get:
      summary: List space allocations
      description: |
        List resource allocations for a space that overlap the given date range (inclusive).
        An allocation is included if its period intersects `filter[from]` through `filter[to]`
        as calendar dates.

        **Access**: The current user must be an admin of the space (or of another
        space in the same network). Members cannot use this endpoint.
      operationId: get-space-allocations
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space the allocations belong to.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: true
          description: Start of the date range (inclusive).
          schema:
            type: string
            format: date
          example: '2018-01-01'
        - name: filter[to]
          in: query
          required: true
          description: End of the date range (inclusive).
          schema:
            type: string
            format: date
          example: '2018-12-31'
        - name: include
          in: query
          required: false
          style: form
          explode: false
          description: |
            Related resources to include. `allocatee` is the membership or team the resource is allocated to.
            When used, the access token must include `read_memberships` and `read_teams`.
          schema:
            type: array
            items:
              type: string
              enum:
                - allocatee
      security:
        - OAuth2:
            - read_allocations
      tags:
        - Allocation
      responses:
        '200':
          description: Allocations for a space overlapping the given date range.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/allocations'
              examples:
                default:
                  value:
                    data:
                      - id: a8f21a71ac8df98d29de357180d27358
                        type: allocations
                        attributes:
                          startsAt: '2018-01-01'
                          canceledTo: '2018-12-31'
                          cycleDuration: 1
                          minimumCommitment: 0
                          recurringMinimumCommitment: false
                          cancellationPeriod: 30
                          pricePerCycle:
                            $ref: ../examples/price.yml
                        relationships:
                          space:
                            data:
                              id: f9a99a71ac8df98d29de357180d273d3
                              type: spaces
                          resource:
                            data:
                              id: a4a99a71ac8df98d29de357180d273d3
                              type: resources
                          allocatee:
                            data:
                              id: f11h2a71ac8df98d29de357180d273a3
                              type: memberships
