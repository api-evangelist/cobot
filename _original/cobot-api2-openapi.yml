  /spaces/{spaceId}/resources/available:
    get:
      summary: Available resources
      description: |
        List the bookable resources that are available to book at a given time.
        This means there are fewer existing bookings than the resources' units.
        For members, the resources' `booking_times`, cutoff, min/max duration and calendar blockers are also taken into account.

        Only resources with `usage: bookable` are returned. Allocatable resources are not included.

        **Access**: The current user must be an admin or member of the space. If the
        space is part of a network, the user must be an admin or member of any
        space in the network.
      operationId: get-available-resources
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space to get the resources for.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: true
          description: The start of the timespan to check for availability.
          schema:
            type: string
            format: date-time
        - name: filter[to]
          in: query
          required: true
          description: The end of the timespan to check for availability.
          schema:
            type: string
            format: date-time
        - name: filter[ignoreBookingId]
          in: query
          required: false
          description: Id of a booking to not consider when determining availability. Useful for determining availbility before moving a booking to a different time.
          schema:
            type: string
        - name: filter[ignoreBookingTimes]
          in: query
          required: false
          description: If set to true, returns resources as available even when the requested time is outside of the resource's booking times setting or blocked by calendar blockers. Option available only for admins of a space.
          schema:
            type: string
            enum:
              - true
              - false
        - name: filter[resourceIds]
          in: query
          required: false
          style: form
          explode: false
          description: Limit returned resources to the given resource ids (comma separated).
          schema:
            type: array
            items:
              type: string
        - name: include
          in: query
          description: |
            List of related resources to include in response.
            Including `categories` requires the `read_resource_categories` scope.
            `media` are the additional photos of a resource (the primary photo is
            in the `photo` attribute).
          schema:
            type: array
            items:
              type: string
              enum:
                - categories
                - media
      security:
        - OAuth2:
            - read_resources
      tags:
        - Resource
      responses:
        '200':
          description: |
            The resources of a space that are available to book at the given time.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/resources'
              examples:
                default:
                  value:
                    data:
                      - id: a4a99a71ac8df98d29de357180d273d3
                        type: resources
                        attributes:
                          name: Meeting Room
                          resourceType: room
                          usage: bookable
                          pricing:
                            currency: EUR
                            taxes:
                              - rate: '20.0'
                                name: Tax
                            pricePerHour:
                              net: '10.0'
                              gross: '12.0'
                              currency: EUR
                              taxes:
                                - rate: '20.0'
                                  name: Tax
                            priceCap:
                              maximumDuration:
                                hours: 8
                                minutes: 0
                            discounts:
                              - pricePerHour:
                                  net: '10.0'
                                  gross: '12.0'
