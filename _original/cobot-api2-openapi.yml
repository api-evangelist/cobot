            - sentStatus
            - reminderStatus
            - canUpdate
            - sentRemindersCount
            - senderTaxId
            - taxId
            - billingEmails
          additionalProperties: false
          properties:
            invoiceText:
              type:
                - string
                - 'null'
            billingEmails:
              type:
                - array
              items:
                type: string
                format: email
            invoiceDate:
              $ref: '#/components/schemas/date'
            paidDate:
              oneOf:
                - $ref: '#/components/schemas/date'
                - type: 'null'
            paidStatus:
              type: string
              enum:
                - unpaid
                - paid
                - pending
                - canceled
                - writtenOff
            dueDate:
              $ref: '#/components/schemas/date'
            eInvoicingReady:
              type: boolean
            remindAt:
              $ref: '#/components/schemas/date'
            number:
              type: string
            sentStatus:
              type: string
              enum:
                - unsent
                - sent
                - sending
                - sendingRequested
                - failedToSend
            reminderStatus:
              type: string
              description: The status of the last invoice reminder.
              enum:
                - notSent
                - sending
                - sent
                - failedToSend
            sentRemindersCount:
              type: integer
              minimum: 0
              description: The number of invoice reminders already sent.
            lastReminderSentAt:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
            senderTaxId:
              description: The tax id of the invoice sender.
              oneOf:
                - type: string
                - type: 'null'
            taxId:
              description: The tax id of the invoice recipient.
              oneOf:
                - type: string
                - type: 'null'
            taxIdName:
              type: string
              description: What the tax id is called (differs by country).
            pdf:
              type: object
              required:
                - url
                - archived
                - eInvoiceStandard
                - eInvoice
              additionalProperties: false
              properties:
                eInvoice:
                  type: boolean
                eInvoiceStandard:
                  oneOf:
                    - type: string
                    - type: 'null'
                url:
                  type: string
                  format: uri
                  description: The URL to the PDF version of the invoice. Note that the URL is not stable and will only work for a few minutes. It works without API authentication.
                archived:
                  type: boolean
                  description: Whether the PDF is archived, i.e. a PDF has been uploaded for the invoice. Before it is archived, a new PDF is generated on the fly on every request. Once archived, the PDF is guaranteed to never change.
            chargeAt:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
              description: If set, the invoice will automatically be charged at the given time.
            canCharge:
              type: boolean
              description: Whether the invoice can automatically be charged by Cobot.
            canUpdate:
              type: boolean
              description: Whether the invoice can be edited. Invoices can be edited until they are locked.
            customerNumber:
              oneOf:
                - type: string
                - type: 'null'
            recipientAddress:
              $ref: '#/components/schemas/invoiceAddress'
            senderAddress:
              $ref: '#/components/schemas/invoiceAddress'
            notes:
              oneOf:
                - type: string
                - type: 'null'
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - description
                  - quantity
                  - amount
                  - totalAmount
                properties:
                  description:
                    type: string
                  paid:
                    type: boolean
                    description: Indicates an item that was already paid when the invoice was generated, i.e. does not contribute to the payable amount.
                  quantity:
                    $ref: '#/components/schemas/decimal'
                  accountingCode:
                    oneOf:
                      - type: string
                      - type: 'null'
                  costCenter:
                    oneOf:
                      - $ref: '#/components/schemas/cost-center'
                      - type: 'null'
                  revenueAccount:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/revenue-account'
                  amount:
                    $ref: '#/components/schemas/price'
                  totalAmount:
                    $ref: '#/components/schemas/price'
            payableAmount:
              $ref: '#/components/schemas/decimal'
            paidAmount:
              $ref: '#/components/schemas/decimal'
            totalAmount:
              $ref: '#/components/schemas/price'
        relationships:
          type: object
          additionalProperties: false
          required:
            - space
            - paymentMethods
          properties:
            contact:
              description: 'Deprecated: use the debitor relationship.'
              type: object
              required:
                - data
              additionalProperties: false
              properties:
