          in: query
          required: true
          description: The text query to search for.
          schema:
            type: string
        - name: filter[paidStatus]
          in: query
          required: false
          description: |
            Provide a comma separated list. Default: all.
            paidStatus=late returns unpaid invoices with remind_at date in the past.
          schema:
            type: array
            items:
              type: string
              enum:
                - paid
                - unpaid
                - pending
                - writtenOff
                - late
        - name: filter[sentStatus]
          in: query
          required: false
          description: |
            Provide a comma separated list. Default: all.
          schema:
            type: array
            items:
