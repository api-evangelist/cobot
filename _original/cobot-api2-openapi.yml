  /resources/{id}/availability:
    get:
      summary: Availability
      description: |
        See the times a resource is still available to book. Considers existing
        bookings, the resource's booking times, cutoff and calendar blockers.

        Only resources with `usage: bookable` are supported. Returns an error for allocatable resources.

        **Access**: The current user must be an admin or member of the space. If the
        space is part of a network, the user must be an admin or member of any
        space in the network.
      operationId: get-resource-availbility
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the resource.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: true
          description: The time from when on to return the availability.
          schema:
            type: string
            format: date-time
        - name: filter[to]
          in: query
          required: true
          description: The time until when to return the availability.
          schema:
            type: string
            format: date-time
      security:
        - OAuth2:
            - read_resources
      tags:
        - Resource
      responses:
        '200':
          description: Available booking times.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/resource-availability'
              examples:
                default:
                  value:
                    data:
                      id: a4a99a71ac8df98d29de357180d273d3
                      type: resourceAvailabilities
                      attributes:
                        availableTimes:
                          - from: '2018-01-01T10:00:00Z'
                            to: '2018-01-01T12:00:00Z'
                          - from: '2018-01-01T14:30:00Z'
                            to: '2018-01-01T19:00:00Z'
                      relationships:
                        resource:
                          data:
                            id: a4a99a71ac8df98d29de357180d273d3
                            type: resources
