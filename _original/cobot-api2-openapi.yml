  /spaces/{spaceId}/events/tags:
    get:
      summary: List Tags
      description: |
        List the most popular tags used when creating events. Returns tags for events
        with the start or end date within specified time range (last 365 days by default).
        **Access**: The current user must be an admin or member of the space. If the
        space is part of a network, the user must be an admin or member of any
        space in the network.
      operationId: list-event-tags
      security:
        - OAuth2:
            - read_events
      tags:
        - Event
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space to get the event tags for.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: false
          description: The start of the time range. If omitted, 12 months ago.
          schema:
            type: string
            format: date-time
          example: '2012-01-01T00:00:00Z'
        - name: filter[to]
          in: query
          required: false
          description: The end of the time range. If omitted, now.
          schema:
            type: string
            format: date-time
          example: '2012-06-30T23:59:59Z'
      responses:
        '200':
          description: A list of the 20 most popular tags used for events in the space.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/event-tags'
              examples:
                default:
                  value:
                    data:
                      - id: 28ef9e2617065920faa4b39892645121
                        type: eventTags
                        attributes:
                          name: Party
  /spaces/{spaceId}/external_bookings:
    get:
      summary: List for space
      description: |
        List a space's external bookings for a given timespan.
        The bookings are filtered by their `from` attribute, not by testing for overlap.

        **Access**: The current user must be an admin of the space.
      operationId: get-space-external-bookings
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space to get the bookings for.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: true
          description: The start of the time range to return external bookings for.
          schema:
            type: string
            format: date-time
          example: '2012-04-12T10:00:00Z'
        - name: filter[to]
          in: query
          required: true
          description: The end of the time range to return external bookings for.
          schema:
            type: string
            format: date-time
          example: '2012-04-14T20:00:00Z'
        - name: filter[sortOrder]
          in: query
          required: false
          description: Whether to sort external bookings by date ascending or descending date.
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
        - name: include
          in: query
          required: false
          description: |
            List of related resources to include in response. Provide a comma separated list of relationship names.
            `invoices` requires the `read_invoices` scope.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - invoices
      security:
        - OAuth2:
            - read_external_bookings
            - read_invoices
      tags:
        - External Booking
      responses:
        '200':
          description: The external bookings for the given space and time frame.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/external-bookings'
              examples:
                default:
                  value:
                    data:
                      - id: b8f21a71ac8df98d29de357180d27358
                        type: externalBookings
