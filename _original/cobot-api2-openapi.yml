    preview-subscription:
      id: preview-subscription.json#
      type: object
      required:
        - data
      additionalProperties: false
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          additionalProperties: false
          properties:
            type:
              type: string
              pattern: spaceSubscriptionPreviewRequests
            attributes:
              type: object
              required:
                - maximumNumberOfMemberships
              additionalProperties: false
              properties:
                maximumNumberOfMemberships:
                  type: integer
                  minimum: 0
                extras:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        required:
                          - type
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                              - radiusSubscriptionExtras
                              - premiumSupportSubscriptionExtras
                      - type: object
                        required:
                          - type
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                              - externalBookingsSubscriptionExtras
                          tier:
                            description: One of the tiers from the list of tiers. The tier is used to determine the monthly price of the extra and the processing fee. If no tier is passed, the lowest is chosen.
                            type: object
                            required:
                              - name
                            additionalProperties: false
                            properties:
                              name:
                                type: string
    cycleDuration:
      description: Determines the duration of a billing cycle in months. When cycle duration is 1, a subscription is charged every month. For cycle duration 12, a subscription is charged annually.
      type: integer
      minimum: 1
    maximumNumberOfMemberships:
      type:
        - integer
        - 'null'
      minimum: 1
      description: The maximum number of memberships this subscription allows. Only memberships with a paid plan count towards the subscription. If null, there is no member limit.
    discount:
      description: When a discount is applied to the subscription, the pricePerCycle attribute shows the discounted price. The original price is shown in discount/originalPricPerCycle.
      oneOf:
        - type: object
          required:
            - percentage
            - originalPricePerCycle
          additionalProperties: false
          properties:
            originalPricePerCycle:
              $ref: '#/components/schemas/price'
            percentage:
              $ref: '#/components/schemas/decimal'
        - type: 'null'
    nextInvoiceDate:
      description: When the next invoice for the subscription is due.
      oneOf:
        - $ref: '#/components/schemas/date'
        - type: 'null'
    subscribed:
      type: boolean
      description: All available extras are returned. Only the ones the space has actually subscribed to have `subscribed` set to true.
    extras:
      description: Extras can be subscribed to in addition to a subscription. Extras can have different types. Each type has its own additional attributes.
      type: array
      items:
        oneOf:
          - type: object
            additionalProperties: false
            required:
              - id
              - type
              - subscribed
              - name
              - pricePerCycle
              - cycleDuration
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - subscriptionExtras
              subscribed:
                $ref: '#/components/schemas/subscribed'
              name:
                type: string
              pricePerCycle:
                $ref: '#/components/schemas/price'
              cycleDuration:
                $ref: '#/components/schemas/cycleDuration'
          - type: object
            additionalProperties: false
            required:
              - id
              - type
              - subscribed
              - name
              - pricePerCycle
              - cycleDuration
              - maximumNumberOfMemberships
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - radiusSubscriptionExtras
              subscribed:
                $ref: '#/components/schemas/subscribed'
              name:
                type: string
              pricePerCycle:
                $ref: '#/components/schemas/price'
              cycleDuration:
                $ref: '#/components/schemas/cycleDuration'
              maximumNumberOfMemberships:
                type:
                  - integer
                  - 'null'
                minimum: 1
                description: The maximum number of memberships this Radius extra allows. This is always the same number as on the subscription.
          - type: object
            additionalProperties: false
            required:
              - id
              - type
              - subscribed
              - name
              - pricePerCycle
              - cycleDuration
              - tiers
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - externalBookingsSubscriptionExtras
              subscribed:
                $ref: '#/components/schemas/subscribed'
              name:
                type: string
              pricePerCycle:
                $ref: '#/components/schemas/price'
              cycleDuration:
                $ref: '#/components/schemas/cycleDuration'
              trial:
                description: This extra has a trial period, during which it is free to use (no fees, no commission).
                type: object
                additionalProperties: false
                properties:
                  available:
                    type: boolean
                    description: Whether the trial for the extra is still available (can only be trialled once).
                  daysRemaining:
                    type: integer
                    minimum: 0
                    description: The number of days remaining in the free trial period. Only shown while the extra is in the free trial period.
              tiers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - name
                    - pricePerCycle
                    - cycleDuration
                    - subscribed
                    - commission
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    pricePerCycle:
                      $ref: '#/components/schemas/price'
                    cycleDuration:
                      $ref: '#/components/schemas/cycleDuration'
                    subscribed:
                      $ref: '#/components/schemas/subscribed'
                    commission:
                      description: The commission that Cobot charges on each external booking in percent.
                      type: object
                      additionalProperties: false
                      required:
                        - percentage
                      properties:
                        percentage:
                          $ref: '#/components/schemas/decimal'
          - type: object
            additionalProperties: false
            required:
              - id
              - type
              - subscribed
              - name
              - pricePerCycle
              - cycleDuration
              - callHoursPerMonth
              - usedCallHoursInMonth
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - premiumSupportSubscriptionExtras
              subscribed:
                $ref: '#/components/schemas/subscribed'
              name:
                type: string
              pricePerCycle:
                $ref: '#/components/schemas/price'
              cycleDuration:
                $ref: '#/components/schemas/cycleDuration'
              callHoursPerMonth:
                description: How many hours worth of support calls are included in the extra.
                type: integer
              usedCallHoursInMonth:
                description: How many hours worth of support calls have been used in the current month.
                type: integer
