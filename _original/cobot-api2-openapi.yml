openapi: 3.1.0
info:
  title: Cobot API
  termsOfService: https://www.cobot.me/terms
  x-logo:
    url: /api2_logo.webp
    backgroundColor: '#FFFFFF'
    altText: Cobot logo
  description: |
    This is the 2.0 version of the Cobot API. You can find version 1.0
    as well as various tutorials under [/api-docs](/api-docs).

    ## JSON API

    This API follows the [JSON API](http://jsonapi.org) standard. This means:

    * requests and responses are sent in JSON
    * all requests MUST send a `Accept: application/vnd.api+json` header
    * non-GET requests MUST send a `Content-Type: application/vnd.api+json` header
    * all responses send a `Content-Type: application/vnd.api+json` header
    * all JSON formats are standardized (requests, responses, errors)

    ## Cross-Origin Resource Sharing (CORS)

    All endpoints send [CORS](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)
    headers so that the API can be used from within browsers.

    ## Rate Limiting

    In general, the rate limit for an endpoint is 60 requests per minute per user.
    If applicable, alternative limits are given in the documentation for
    particular endpoints.

    If you've exceeded the limit, Cobot will return a 429 status code and a JSON
    error message. The response will also contain a *Retry-After* header, this
    denotes the number of seconds to wait before your client may retry.

    ## Times and Dates

    Times and Dates must be in ISO 8601 formats. e.g. date: `2021-01-07`, datetime: `2021-01-07T16:25:51Z`,  time: `16:25:51`.
    Millisecond are ommited, so `16:25:51.811` will become `16:25:51`.
    Time zone offsets must be provided by the client, e.g. `16:25:51+02:00` or '16:25:51Z' for UTC.

    Times are always returned in UTC.
    ## Sparse Fieldsets

    This API supports [sparse fieldsets](https://jsonapi.org/format/#fetching-sparse-fieldsets),
    so clients can request which attributes they are interested in.

    Example:
    ```
    GET https://api.cobot.me/user?fields[users]=email
    ```
    This will only return the user's email.

    ## Query params

    When passing query params, arrays of data are expected to be sent as a string of comma separated values.

    ## Pagination

    All collections are paginated. Pagination follows [JSON-API standards](https://jsonapi.org/format/#fetching-pagination).

    Example:
    ```json
    {
      "meta": {
        "totalPages": 2,
        "currentPage": 1
      },
      "data": [{
        "id": "1",
        "type": "users",
      }],
      "links": {
        "self": "/users?page[size]=100&page[number]=1",
        "first": "/users?page[size]=100&page[number]=1",
        "prev": null,
        "next": "/users?page[size]=100&page[number]=2",
        "last": "/users?page[size]=100&page[number]=1"
      }
    }
    ```

    Default page size is 72 and can be changed by passing a `page[size]` parameter. Maximum page size is 200.

    ## Errors

    When a client sends invalid data in a request, Cobot returns a
    422 status code and a JSON-API error response.

    Example:
    ```json
    {
      "errors": [
        {
          "source": {
            "pointer": "/data/attributes/name"
          },
          "detail": "can't be blank"
        },
        {
          "source": {
            "pointer": "/data/attributes/password"
          },
          "detail": "is too short"
        }
      ]
    }
    ```
  version: '2.0'
  contact:
    name: Cobot Support
    url: https://dev.cobot.me/
    email: support@cobot.me
servers:
  - url: https://api.cobot.me
security:
  - OAuth2: []
tags:
  - name: Approval
    description: Approving terms & conditions, privacy policies etc. as a member of a space.
  - name: Article
    description: A help desk article explaning an aspect of the space.
  - name: Allocation
    description: A long-term allocation of a resource to a membership or team.
  - name: Booking
    description: A booking of a resource in the booking calendar.
  - name: Booking Credit
    description: Booking credits are added to plans and give memberships free booking time or a fixed amount of free bookings. The hourly rate of a resource can also be customized.
  - name: Built-in Email Customizations
    description: Email customizations for emails that can be sent via Cobot.
  - name: Calendar Blocker
    description: Blocks off a space for member/external bookings and drop-in passes.
  - name: Check-in
    description: Members check in to a space for attendance tracking and for using up their time passes.
  - name: Contact
    description: Non-member contacts a space has.
  - name: Cost Center
    description: |
      Cost centers are used to categorize invoice items. Anything
      that can be invoiced can be assigned a cost center.
      When a service/charge is added to an invoice, its cost center will be
      assigned to the respective invoice item.
  - name: Customer
    description: A trial space can be converted to a customer
  - name: Discount Code
    description: A discount code can be used to offer a discount for various products in a space.
  - name: Drop-In Pass
    description: Purchased drop-in passes.
  - name: Drop-In Pass Purchase
    description: A purchase of drop-in-passes, currently only supports buying one pass at a time.
  - name: Drop-In Pass Template
    description: Drop-in pass templates are templates for drop-in passes that can be bought by visitors.
  - name: Event
    description: |
      Spaces can run events for their members or the public.
      Events are created and later published by admins, at which point members are able to see and attend them.
      Admins can also create messages for events, which are sent to attendees based on triggers such as someone having
      just attended an event.
  - name: External Booking
    description: |
      After a resource has been enabled for external booking (see _External Resource_) it can be
      booked by visitors (non-members) using external booking endpoints.
      Making an external booking also results in a Booking to be created.
  - name: External Resource
    description: |
      A space's resources can be enabled for external booking, which means they can be booked
      by guests without a Cobot account or space membership. All resources enabled for external booking
      appear under external resources.
  - name: Invoice
    description: Invoices are automatically generated once a month, based on members' activity. In addition, manual invoices can be generated at any time.
  - name: Invoice Reminder
    description: Admins can send invoice reminders for overdue invoices.
  - name: Membership
    description: Represents a person being a member in a space. Can optionally be connected to a User.
  - name: Membership Plan
    description: |
      The plans belonging to a membership. When a membership is signed up one of the
      space's plans is selected and a copy is created for the membership.
      A membership's plan can be customized or changed over time, creating a new
      membership plan object every time.
  - name: Membership Profile
    description: Social profile for a membership.
  - name: Navigation Link
    description: Navigation links allow you to embed 3rd party apps on a space's Cobot UI. See also the single page app endpoints.
  - name: Network
    description: Multiple spaces can form a network. This allows their members to access multiple spaces, for example to book resources.
  - name: Payment
    description: |
      *The payment API is in development. Endpoints may be missing or not working yet.*

      Payments allow any user (i.e. non-members) to pay for items on Cobot via the payment
      methods a space has set up.
      For now this only covers external bookings, but more could be added in the future.
  - name: Payment Method
    description: |
      Spaces can set up payment methods that members can use to make payments to the space.
      Payment methods can be automated via a payment provider such as Stripe or manual (e.g. cash, bank transfer).
  - name: Product
    description: |
      Products can be set up by a space and then used as booking extras or to create charges from.
      Examples are coffee, projectors, additional cleaning services etc.
  - name: Refund
    description: A full or partial refund of an invoice.
  - name: Resource
    description: A resource can be booked on an hourly basis using the booking calendar. Examples are conference rooms, presentation equipment, bikes etc.
  - name: Revenue Account
    description: |
      Revenue accounts are used to categorize invoice items. Anything
      that can be invoiced can be assigned a revenue account.
      When a service/charge is added to an invoice, its revenue account will be
      assigned to the respective invoice item.
  - name: Single page app
    description: A single page app consists of HTML, CSS and JavaScript code. It can be embedded into the Cobot UI via navigation links.
  - name: Space
    description: A coworking space. Spaces can form a network to allow members access to multiple spaces.
  - name: Space Billing Details
    description: Billing details of a space.
  - name: Space Payment Method
    description: The payment method a space uses to pay their Cobot subscription.
  - name: Space Preview
    description: Preview of a to-be-created space.
  - name: Space Profile
    description: Public profile information such as location, phone, website, social media links.
  - name: Subscription
    description: How much a space pays Cobot, how many members they can have and the extras they have booked.
  - name: Url
    description: |
      These  URLs/URL templates enable API clients to provide
      links to the Cobot web interface without having to hard-code them.

      Each Url includes a unique, never changing `identifier` and either a `url`
      or `urlTemplate`. Templates must be expanded according to RFC 6570.
  - name: User
    description: A user is used to log in to Cobot via email/password. Users can be admins/members (see Membership) in multiple spaces.
  - name: User Email Preview
    description: Confirms if a given email address is free to take.
paths:
  /articles/{id}:
    get:
      summary: Single article
      description: |
        **Access**: The current user must be an admin or member of the space
        the article belongs to. If the
        space is part of a network, the user must be an admin or member of any
        space in the network.
      operationId: get-article
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the article.
          schema:
            type: string
      security:
        - OAuth2:
            - read_articles
      tags:
        - Article
      responses:
        '200':
          description: Details of an article.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/article'
              examples:
                default:
                  value:
                    data:
                      id: bc302cc2-f3f6-563e-8c09-37fcae5088b8
                      type: articles
                      attributes:
                        title: How to print
                        content: <p>First, grab a cup of coffee...</p>
                      relationships:
                        space:
                          data:
                            id: f9a99a71ac8df98d29de357180d273d3
                            type: spaces
  /bookings:
    post:
      summary: Book as admin
      description: |
        Create booking as an admin. Optionally a booking can be assigned to a membership.

        **Access**: The current user must be an admin of the space. If the
        space is part of a network, the user must be an admin of any
        space in the network.
      operationId: create-admin-booking
      security:
        - OAuth2:
            - write_bookings
      tags:
        - Booking
      responses:
        '201':
          description: New booking
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/booking'
              examples:
                default:
                  value:
                    data:
                      id: b8f21a71ac8df98d29de357180d27358
                      type: bookings
                      attributes:
                        from: '2018-01-01T12:00:00Z'
                        to: '2018-01-01T14:00:00Z'
                        units: 1
                        title: team meeting
                        url: https://example.com/team-meeting
                        comments: there is going to be coffe and cake
                        attendeesMessage: Please bring your laptop
                        attendees:
                          - email: attendee@example.com
                        price:
                          net: '10.0'
                          gross: '12.0'
                          currency: EUR
                          taxes:
                            - rate: '20.0'
                              name: Tax
                        canUpdate: true
                        cancellationPeriod: 0
                      relationships:
                        space:
                          data:
                            id: f9a99a71ac8df98d29de357180d273d3
                            type: spaces
                        resource:
                          data:
                            id: a4a99a71ac8df98d29de357180d273d3
                            type: resources
                        membership:
                          data:
                            id: 89da3cb66b5e6b39007690854kd66da4
                            type: memberships
                        externalBooking:
                          data: null
        '202':
          description: |
            New recurring booking. Returns 202 since the bookings are created
            asynchronously (except the first one).

            The bookings can be fetched via
            the _recurringBookings_ relationship, which also lets you track
            if all bookings have been written.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/booking'
              examples:
                default:
                  value:
                    data:
                      id: b8f21a71ac8df98d29de357180d27358
                      type: bookings
                      attributes:
                        from: '2018-01-01T12:00:00Z'
                        to: '2018-01-01T14:00:00Z'
                        units: 1
                        title: team meeting
                        url: https://example.com/team-meeting
                        comments: there is going to be coffe and cake
                        attendeesMessage: Please bring your laptop
                        attendees:
                          - email: attendee@example.com
                        price:
                          net: '10.0'
                          gross: '12.0'
                          currency: EUR
                          taxes:
                            - rate: '20.0'
                              name: Tax
                        canUpdate: true
                        cancellationPeriod: 0
                        recurrence:
                          rule:
                            frequency: weekly
                            interval: 1
                            from: '2018-01-01'
                            until: '2018-01-22'
                            count: null
                            weekdays: null
                      relationships:
                        space:
                          data:
                            id: f9a99a71ac8df98d29de357180d273d3
                            type: spaces
                        recurringBookings:
                          links:
                            related: /recurring_bookings/a3281b61ac8df98d29de357180d212e4
                        followingRecurringBookings:
                          links:
                            related: /bookings/a3281b61ac8df98d29de357180d212e4/following
                        resource:
                          data:
                            id: a4a99a71ac8df98d29de357180d273d3
                            type: resources
                        membership:
                          data:
                            id: 89da3cb66b5e6b39007690854kd66da4
                            type: memberships
                        externalBooking:
                          data: null
        '400':
          description: |
            The booking's resource is not bookable.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
              examples:
                default:
                  value:
                    errors:
                      - detail: Resource is not bookable.
      requestBody:
        description: Booking to be created
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/create-booking'
            examples:
              default:
                value:
                  data:
                    type: bookings
                    attributes:
                      from: '2018-01-01T12:00:00Z'
                      to: '2018-01-01T14:00:00Z'
                      units: 1
                      title: team meeting
                      url: https://example.com/team-meeting
                      comments: there is going to be coffe and cake
                      attendeesMessage: Please bring your laptop
                      attendees:
                        - email: attendee@example.com
                      customPrice:
                        net: '12.00'
                    relationships:
                      resource:
                        data:
                          id: 99da6cb66b5e6b39007690854fd66df9
                          type: resources
                      membership:
                        data:
                          id: 89da3cb66b5e6b39007690854kd66da4
                          type: memberships
              recurring:
                value:
                  data:
                    type: bookings
                    attributes:
                      from: '2018-01-01T12:00:00Z'
                      to: '2018-01-01T14:00:00Z'
                      units: 1
                      recurrence:
                        rule:
                          frequency: weekly
                          interval: 1
                          until: '2018-01-22'
                          weekdays:
                            - 1
                            - 3
                    relationships:
                      resource:
                        data:
                          id: 99da6cb66b5e6b39007690854fd66df9
                          type: resources
                      membership:
                        data:
                          id: 89da3cb66b5e6b39007690854kd66da4
                          type: memberships
  /recurring_bookings/{recurringId}:
    get:
      summary: List recurring
      description: |
        List all the recurring bookings belonging to a booking with recurrence.

        The data returned by this endpoint is only eventually consistent.

        **Access**: The current user must be an admin or member of the space. If the
        space is part of a network, the user must be an admin or member of any
        space in the network.
      operationId: get-recurring-bookings
      parameters:
        - name: recurringId
          in: path
          required: true
          description: The id of the recurrence.
          schema:
            type: string
      security:
        - OAuth2:
            - read_bookings
      tags:
        - Booking
      responses:
        '200':
          description: All bookings belonging to the same recurrence.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/recurring-bookings'
              examples:
                default:
                  value:
                    data:
                      - id: b8f21a71ac8df98d29de357180d27358
                        type: bookings
                        attributes:
                          from: '2018-01-01T12:00:00Z'
                          to: '2018-01-01T14:00:00Z'
                          title: meeting
                          url: https://example.com/meeting
                          comments: nil
                          attendees: []
                          price:
                            $ref: ../examples/price.yml
                          canUpdate: true
                          units: 1
                          cancellationPeriod: 0
                          recurrence:
                            rule:
                              frequency: weekly
                              interval: 1
                              from: '2018-01-01'
                              until: '2018-01-22'
                              weekdays: null
                              count: null
                        relationships:
                          space:
                            data:
                              id: f9a99a71ac8df98d29de357180d273d3
                              type: spaces
                          resource:
                            data:
                              id: a4a99a71ac8df98d29de357180d273d3
                              type: resources
                          membership:
                            data:
                              id: f11h2a71ac8df98d29de357180d273a3
                              type: memberships
                          recurringBookings:
                            links:
                              related: /recurring_bookings/a3281b61ac8df98d29de357180d212e4
                          followingRecurringBookings:
                            links:
                              related: /bookings/b8f21a71ac8df98d29de357180d27358/following
                          externalBooking:
                            data: null
                    meta:
                      consistent: true
                      totalPages: 1
                      currentPage: 1
  /recurring_bookings/{bookingId}/following:
    delete:
      summary: Delete following
      description: |
        Delete a recurring booking and all the following instances.

        **Access**: The current user must be an admin of the space or the member who made the booking.
      operationId: delete-following-recurring-bookings
      parameters:
        - name: bookingId
          in: path
          required: true
          description: The id of the booking to delete.
          schema:
            type: string
      security:
        - OAuth2:
            - write_bookings
      tags:
        - Booking
      responses:
        '202':
          description: The deleted booking.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/booking'
              examples:
                default:
                  value:
                    data:
                      id: b8f21a71ac8df98d29de357180d27358
                      type: bookings
                      attributes:
                        from: '2018-01-01T12:00:00Z'
                        to: '2018-01-01T14:00:00Z'
                        title: meeting
                        url: https://example.com/meeting
                        comments: nil
                        attendees: []
                        price:
                          net: '10.0'
                          gross: '12.0'
                          currency: EUR
                          taxes:
                            - rate: '20.0'
                              name: Tax
                        canUpdate: true
                        cancellationPeriod: 0
                        units: 1
                        recurrence:
                          rule:
                            frequency: weekly
                            interval: 1
                            from: '2018-01-01'
                            until: '2018-01-22'
                            count: null
                            weekdays: null
                      relationships:
                        space:
                          data:
                            id: f9a99a71ac8df98d29de357180d273d3
                            type: spaces
                        resource:
                          data:
                            id: a4a99a71ac8df98d29de357180d273d3
                            type: resources
                        membership:
                          data:
                            id: f11h2a71ac8df98d29de357180d273a3
                            type: memberships
                        recurringBookings:
                          links:
                            related: /recurring_bookings/a3281b61ac8df98d29de357180d212e4
                        followingRecurringBookings:
                          links:
                            related: /bookings/b8f21a71ac8df98d29de357180d27358/following
                        externalBooking:
                          data: null
  /bookings_preview:
    post:
      summary: Bookings preview
      description: |
        Return all booking previews for given resources for a membership in the given time range.

        **Access**: The current user must be the owner of the membership the booking belongs to or an admin of the space or network.
      operationId: post-bookings-preview
      requestBody:
        description: The time range and resource ids list.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/create-bookings-preview'
            examples:
              default:
                value:
                  data:
                    type: bookingPreviews
                    attributes:
                      from: '2018-01-01T12:00:00Z'
                      to: '2018-01-01T14:00:00Z'
                    relationships:
                      booking:
                        data:
                          id: 42ac6cb66b5ebb30007290854fd46ae0
                          type: bookings
                      resources:
                        data:
                          - id: 99da6cb66b5e6b39007690854fd66df9
                            type: resources
                      membership:
                        data:
                          id: 89da3cb66b5e6b39007690854kd66da4
                          type: memberships
              recurring:
                value:
                  data:
                    type: bookingPreviews
                    attributes:
                      from: '2018-01-01T12:00:00Z'
                      to: '2018-01-01T14:00:00Z'
                      recurrence:
                        rule:
                          frequency: daily
                          from: '2018-01-01'
                          until: '2018-01-02'
                    relationships:
                      resources:
                        data:
                          - id: 99da6cb66b5e6b39007690854fd66df9
                            type: resources
                      membership:
                        data:
                          id: 89da3cb66b5e6b39007690854kd66da4
                          type: memberships
      security:
        - OAuth2:
            - read_resources
            - read_memberships
      tags:
        - Booking
      responses:
        '200':
          description: Booking previews for given resources for a membership in the given time range.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/booking-previews'
              examples:
                default:
                  value:
                    data:
                      - id: b8f21a71ac8df98d29de357180d27358
                        type: bookingPreviews
                        attributes:
                          from: '2018-01-01T12:00:00Z'
                          to: '2018-01-01T14:00:00Z'
                          appliedDiscounts:
                            - pricePerHour:
                                net: '6.0'
                                gross: '6.6'
                                currency: EUR
                                taxes:
                                  - rate: '10.0'
                                    amount: '0.6'
                                    name: VAT
                              minimumDuration:
                                hours: 1
                                minutes: 0
                          appliedFixedRates:
                            - maximumDuration:
                                hours: 2
                                minutes: 0
                              price: '10.0'
                              count: 2
                          appliedPriceCap:
                            maximumDuration:
                              hours: 2
                              minutes: 0
                          attendees: []
                          title: meeting
                          comments: null
                          price:
                            $ref: ../examples/price.yml
                          estimatedPayablePrice:
                            $ref: ../examples/price.yml
                          canUpdate: true
                          cancellationPeriod: 0
                          bookingExtras: []
                          bookingCredits:
                            estimatedMinutesUsed: 30
                            estimatedAmountUsed:
                              $ref: ../examples/price.yml
                          bookingPasses:
                            estimatedMinutesUsed: 60
                        relationships:
                          space:
                            data:
                              id: f9a99a71ac8df98d29de357180d273d3
                              type: spaces
                          resource:
                            data:
                              id: a4a99a71ac8df98d29de357180d273d3
                              type: resources
                          membership:
                            data:
                              id: b5a99a71ac8df98d2gn8380d273d3
                              type: memberships
                          externalBooking:
                            data: null
                recurring:
                  value:
                    data:
                      - id: b8f21a71ac8df98d29de357180d27358
                        type: bookingPreviews
                        attributes:
                          from: '2018-01-01T12:00:00Z'
                          to: '2018-01-01T14:00:00Z'
                          appliedDiscounts:
                            - pricePerHour:
                                net: '6.0'
                                gross: '6.6'
                                currency: EUR
                                taxes:
                                  - rate: '10.0'
                                    amount: '0.6'
                                    name: VAT
                              minimumDuration:
                                hours: 1
                                minutes: 0
                          appliedFixedRates:
                            - maximumDuration:
                                hours: 2
                                minutes: 0
                              price: '10.0'
                              count: 2
                          appliedPriceCap:
