  /navigation_links:
    post:
      summary: Create
      description: |
        Create a navigation link.

        Navigation links create new entries in the navigation of a space, either
        in the admin or member section. This allows you to show users content/apps
        created not by Cobot.

        When creating a navigation link, you have to pass a single page app as
        a relationship. This app's CSS/JS is going to be embedded on Cobot
        on the new page created by the navigation link.

        To embed an iframe or create an external link instead of embedding 
        a single page app, see the navigation link endpoints in API 1.
      operationId: create-navigation-link
      security:
        - OAuth2:
            - write_navigation_links
      tags:
        - Navigation Link
      responses:
        '201':
          description: The new navigation link.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/navigation-link'
              examples:
                default:
                  value:
                    data:
                      id: 0952499e-82dc-59f1-b6aa-fcac8f2bccf9
                      type: navigationLinks
                      attributes:
                        label: External App
                        section: admin/manage
                        userUrl: https://demo.cobot.me/admin/navigation_links/0952499e-82dc-59f1-b6aa-fcac8f2bccf9
                      relationships:
                        space:
                          data:
                            id: bac10fb5-f3a4-5597-9af6-846d7561cec4
                            type: spaces
                        singlePageApp:
                          data:
                            id: cc63f516-e1e3-57b1-9825-5d937235c66f
                            type: singlePageApps
        '422':
          description: |
            Creating the navigation link failed because of missing/invalid data.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
              examples:
                default:
                  value:
                    errors:
                      - source:
                          pointer: /data/attributes/label
                        detail: can't be empty
      requestBody:
        description: The attributes and relationships.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/create-navigation-link'
            examples:
              default:
                value:
                  data:
                    type: navigationLinks
                    attributes:
                      label: External app
                      section: admin/setup
                    relationships:
                      space:
                        data:
                          id: a2461baa-0661-5d7f-a8ff-dcbde5632001
                          type: spaces
                      singlePageApp:
                        data:
                          id: 70b0ed4a-43a3-5864-b238-99fed02ba5aa
                          type: singlePageApps
