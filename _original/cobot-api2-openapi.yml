  /spaces/{spaceId}/external_resources/available:
    get:
      summary: Available resources
      description: |
        List the external resources that are available to book at a given time.
        This means there are fewer existing bookings than the resources' units.
        `booking_times`, min/max duration and calendar blockers are also taken into account.

        **Access**: Any user can access any space's external resources.
      operationId: get-available-external-resources
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space to get the resources for.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: true
          description: The start of the timespan to check for availability.
          schema:
            type: string
            format: date-time
        - name: filter[to]
          in: query
          required: true
          description: The end of the timespan to check for availability.
          schema:
            type: string
            format: date-time
        - name: filter[ignoreBookingTimes]
          in: query
          required: false
          description: If set to true, returns resources as available even when the requested time is outside of the resource's booking times setting or blocked by calendar blockers. Option available only for admins of a space.
          schema:
            type: boolean
        - name: filter[ignoreExternalBookingId]
          in: query
          required: false
          description: |
            Id of an external booking to not consider when determining
            availability. Useful for determining availbility before moving an
            external booking to a different time.
          schema:
            type: string
        - name: filter[minimumCapacity]
          in: query
          required: false
          description: |
            If set, returns only resources where capacity is greater than or equal to requested value.
          schema:
            type: integer
        - name: include
          in: query
          description: |
            List of related resources to include in response.
            `media` are the additional photos of a resource (the primary photo is
            in the `photo` attribute).
          schema:
            type: array
            items:
              type: string
              enum:
                - media
