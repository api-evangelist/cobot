      id: '-space-data.json'
      type: object
      required:
        - id
        - type
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - spaces
        attributes:
          type: object
          required:
            - name
            - subdomain
            - createdAt
            - email
            - countryCode
            - locale
            - description
            - inEu
            - timeZone
            - hourFormat
            - priceDisplay
            - priceDecimals
            - logo
            - defaultTaxes
          additionalProperties: false
          properties:
            createdAt:
              $ref: '#/components/schemas/date'
            email:
              type: string
            name:
              type: string
            subdomain:
              type: string
            description:
              oneOf:
                - type: string
                - type: 'null'
            countryCode:
              type: string
              description: Two letter country code, e.g. DE for Germany.
            locale:
              type: string
              description: The default locale (language), e.g. en-US.
            logo:
              oneOf:
                - type: object
                  properties:
                    pdf:
                      $ref: '#/components/schemas/photo'
                    icon152:
                      $ref: '#/components/schemas/photo'
                    icon32:
                      $ref: '#/components/schemas/photo'
                    default:
                      $ref: '#/components/schemas/photo'
                  additionalProperties: false
                - type: 'null'
            inEu:
              type: boolean
              description: Whether the space is in the European Union.
            defaultTaxes:
              description: The taxes that apply to all charges exept where overridden.
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  name:
                    type: string
                  rate:
                    $ref: '#/components/schemas/decimal'
            timeZone:
