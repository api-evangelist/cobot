  /payments:
    post:
      summary: Initiate payment
      description: |
        Initiates a new payment for a purchase, but does not complete it.
        Supported purchases are:

        * external bookings - initiate a payment for an external booking (needs to happen before making the booking)
          * discount codes can be applied only to external bookings for now
        * drop-in passes - initiate a payment for a drop-in pass (needs to happen before buying the pass)
        * event attendances - initiate a payment for an event attendance (needs to happen before before creating the event attendance)

        After creating a payment, payment details such as credit card numbers need to
        be added via the user's browser. This can happen via JavaScript calls or a
        browser redirect.

        Supported payment providers:

        ### Stripe

        Stripe uses payment intents and [Stripe.js](https://stripe.com/docs/js) to process payments.
        Calling this endpoint will
        return a _payment intent client secret_ which you need in order to collect payment data
        and complete the payment in the browser.
        See https://stripe.com/docs/payments/accept-a-payment?ui=elements.

        ### PayPal

        Calling this endpoint will return an _orderId_ which you need in order to collect payment data
        and complete the payment in the browser.

        Note: currently in development, created orders can be paid but are not yet linked, automatically.

        **Access**: Any user can initiate payments.
      operationId: create-payment
      security:
        - OAuth2:
            - write_payments
      tags:
        - Payment
      responses:
        '200':
          description: |
            Returns information needed to complete the payment via an external payment provider.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/payment'
              examples:
                stripe:
                  value:
                    data:
                      id: b8f21a71ac8df98d29de357180d27358
                      type: payments
                      attributes:
                        amount:
                          value: '100.0'
                          currency: EUR
                        paymentProvider: stripe
                        providerAttributes:
                          paymentIntentClientSecret: a1d952f1ac8cf98d29de357180d27734
                          paymentIntentId: pi_ANipwO3zNfjeWODtRPIg
                      relationships:
                        paymentMethod:
                          data:
                            id: 0eead1dc-f1cb-51ae-92a6-7031299f2cec
                            type: paymentMethods
                        space:
                          data:
                            id: 99a12ca68b5e6bc9007890854kd368f2
                            type: spaces
                paypal:
                  value:
                    data:
                      id: b8f21a71ac8df98d29de357180d27358
                      type: payments
                      attributes:
                        amount:
                          value: '100.0'
                          currency: EUR
                        paymentProvider: paypal
                        providerAttributes:
                          orderId: a1d952f1ac8cf98d29de357180d27734
                      relationships:
                        paymentMethod:
                          data:
                            id: 0eead1dc-f1cb-51ae-92a6-7031299f2cec
                            type: paymentMethods
                        space:
                          data:
                            id: 99a12ca68b5e6bc9007890854kd368f2
                            type: spaces
        '422':
          description: Creating a payment failed because a condition was not met or the space's Stripe setup is incorrect.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
              examples:
                default:
                  value:
                    errors:
                      - detail: Payment could not be created.
                        source:
                          pointer: /data/relationships/paymentMethod
      requestBody:
        description: Data needed to initiate a payment. Varies with each payment provider.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/create-payment'
            examples:
              externalBookings:
                value:
                  data:
                    type: payments
                    attributes:
                      payable:
                        type: externalBookings
                        attributes:
                          from: '2021-11-28T12:00:00Z'
                          to: '2021-11-28T14:30:00Z'
                          bookingExtras:
                            - productId: 17456ef0aac79b82742d76f2ed7ce582
                              quantity: '1.0'
                        relationships:
                          externalResource:
                            id: 8056fb60-f239-5330-af26-7365d55c032c
                          discount:
                            data:
                              id: 8056fb60-f239-5330-af26-7365d55c032c
                              type: discountCodes
                    relationships:
                      paymentMethod:
                        data:
                          id: 0eead1dc-f1cb-51ae-92a6-7031299f2cec
                          type: paymentMethods
                      space:
                        data:
                          id: 620b9c47-8413-519b-8979-8cc08958c298
                          type: spaces
              dropInPasses:
                value:
                  data:
                    type: payments
                    attributes:
                      payable:
                        - type: dropInPasses
                          attributes:
                            validOn: '2021-11-28'
                            numberOfPasses: 1
                          relationships:
                            dropInPassTemplate:
                              data:
                                id: 8056fb60-f239-5330-af26-7365d55c032c
                                type: dropInPassTemplates
                    relationships:
                      paymentMethod:
                        data:
                          id: 0eead1dc-f1cb-51ae-92a6-7031299f2cec
                          type: paymentMethods
                      space:
                        data:
                          id: 620b9c47-8413-519b-8979-8cc08958c298
