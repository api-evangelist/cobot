        - name: spaceId
          in: path
          required: true
          description: The id of the space the discount code belongs to.
          schema:
            type: string
        - name: filter[code]
          in: query
          required: true
          description: The discount code to look up.
          schema:
            type: string
        - name: filter[discounted_id]
          in: query
          required: true
          description: The id of the discounted object (e.g. a plan id, external resource id, etc.)
          schema:
            type: string
      security:
        - OAuth2:
            - read_discount_codes
      tags:
        - Discount Code
      responses:
        '200':
          description: Details of a valid discount code.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/discount-code'
              examples:
                percentage:
                  value:
                    data:
                      id: e6a53fb4a996cfa147e174e265edc5e0
                      type: discountCodes
                      attributes:
                        name: Summer Sale
                        unit: percentage
                        value: '10'
                amount:
                  value:
                    data:
                      id: e6a53fb4a996cfa147e174e265edc5e0
                      type: discountCodes
                      attributes:
                        name: New Member Discount
                        unit: amount
                        value: '25.0'
        '404':
          description: The discount code was not found or is not valid.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/failure'
              examples:
                default:
                  value:
                    errors:
                      - title: Expired
                        detail: The code has expired..
  /spaces/{spaceId}/events:
    get:
      summary: List events
      description: |
        List/filter events for a time range.
        **Access**: Any user can see the list of events. Only admins of the space can see draft events.
      operationId: list-events
      security:
        - OAuth2:
            - read_events
      tags:
        - Event
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space to get the events for.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: |
            List of related resources to include in response as comma separated string.

            Including `attendances.attendee` will also return `attendances`.
            A maximum of 5 attendances per event is returned. If the current user is attending,
            their attendance will be included in the 5. The full count is returned in the meta section.

            Including `attendances` requires the `read_event_attendances` scope.
            Including `attendances.attendee` requires the `read_event_attendances` and `read_memberships` scopes.
          schema:
            type: array
            items:
              type: string
              enum:
                - attendances
                - attendances.attendee
        - name: filter[from]
          in: query
          required: true
          description: The start of the time range.
          schema:
            type: string
            format: date-time
          example: '2012-04-12T10:00:00Z'
        - name: filter[to]
          in: query
          required: true
          description: The end of the time range.
          schema:
            type: string
            format: date-time
          example: '2012-04-30T23:59:59Z'
        - name: filter[publishedState]
          in: query
          example: draft,published
          required: true
          style: form
          explode: false
          description: |
            Return draft/published events. Pass a comma separated list of states.
            Only admins can request draft events.
          schema:
            type: array
            items:
              type: string
              enum:
                - draft
                - published
        - name: filter[tags]
          in: query
          required: false
          description: |
            Comma separated list of tags to filter events by.
            To include events with no tags pass an empty
            tag (alone: `filter[tags]=`, with other tags: `filter[tags]=tag1,,tag2`).
            When this parameter is left out, events with any or no tags are returned.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          example: party,free
        - name: filter[resourceIds]
          in: query
          required: false
          style: form
          explode: false
          description: |
            Filter events by the resources they use (list of resource ids separated by commas).
            To include events with no resources pass an empty resource id
            (alone: `filter[resourceIds]=`, with other ids: `filter[resourceIds]=r1,,r2`).
            When this parameter is left out, events with any or no resources are returned.
          schema:
            type: array
            items:
              type: string
          example: a4a99a71ac8df98d29de357180d273d3,13b73f71ac8df98129de357180d219a6
        - name: filter[attendeeIds]
          in: query
