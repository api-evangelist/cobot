  /spaces/{spaceId}/resource_availabilities:
    get:
      summary: List resource availabilities
      description: |
        List the availability of multiple resources in a space for a given time range. Considers existing bookings, each resource's booking times, cutoff, and calendar blockers.

        **Access**: The current user must be an admin or member of the space. If the space is part of a network, the user must be an admin or member of any space in the network.
      operationId: get-resource-availabilities
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: true
          description: The time from when on to return the availability.
          schema:
            type: string
            format: date-time
        - name: filter[to]
          in: query
          required: true
          description: The time until when to return the availability.
          schema:
            type: string
            format: date-time
        - name: filter[resource_ids]
          in: query
          required: true
          style: form
          explode: false
          description: Comma-separated list of resource ids to return availabilities for.
          schema:
            type: array
            items:
              type: string
      security:
        - OAuth2:
            - read_resources
      tags:
        - Resource
      responses:
        '200':
          description: Availabilities for the requested resources.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/resource-availabilities'
              examples:
                default:
                  value:
                    data:
                      - id: a4a99a71ac8df98d29de357180d273d3
                        type: resourceAvailabilities
                        attributes:
                          availableTimes:
                            - from: '2018-01-01T10:00:00Z'
                              to: '2018-01-01T12:00:00Z'
                            - from: '2018-01-01T14:30:00Z'
                              to: '2018-01-01T19:00:00Z'
                        relationships:
                          resource:
                            data:
                              id: a4a99a71ac8df98d29de357180d273d3
                              type: resources
                      - id: b7b99a71ac8df98d29de357180d273d4
                        type: resourceAvailabilities
                        attributes:
                          availableTimes:
                            - from: '2018-01-01T09:00:00Z'
