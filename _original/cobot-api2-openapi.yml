  /spaces/{spaceId}/check_ins/current:
    get:
      summary: Current by token
      description: |
        List check-ins for a membership in a space that are still current, i.e.
        their `validUntil` attribute is in the future.

        The membership is determined by passing a `checkInToken`.
        If the space is part of a network, check-ins can be fetched for any space
        of the network.

        **Access**: The current user must be an admin of the space the membership belongs to.
      operationId: list-space-check-ins-current
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space the check-ins belong to.
          schema:
            type: string
        - name: filter[checkInToken]
          in: query
          required: true
          description: |
            A check-in token of the membership the check-ins belong to. Check-in tokens
            are created via the check-in token API and are typically MAC addresses
            or RFID tokens.
          schema:
            type: string
      security:
        - OAuth2:
            - read_check_ins
      tags:
        - Check-in
      responses:
        '200':
          description: List check-ins.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/check-ins'
              examples:
                default:
                  value:
                    data:
                      - id: 12a8fa71ac8df98d29de357180d274d8
                        type: checkIns
                        attributes:
                          validFrom: '2018-01-01T12:45:00Z'
                          validUntil: '2018-01-01T23:59:59Z'
