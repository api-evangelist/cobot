  /spaces/{spaceId}/external_bookings_payment_methods:
    get:
      summary: List externals
      description: |
        List the payment methods of a space that can be used to pay for an external booking. Payment methods can have a payment provider.
        In this case, custom attributes needed for payment processing are returned via the
        `providerAttributes`.

        **Access**: Any user can list a space's payment methods.
      operationId: get-space-external-bookings-payment-methods
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space to get the payment methods for.
          schema:
            type: string
      security:
        - OAuth2:
            - read_payment_methods
      tags:
        - Payment Method
      responses:
        '200':
          description: List of payment methods.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/payment-methods'
              examples:
                default:
                  value:
                    data:
                      - id: 2465b308-df41-5857-a474-22361acdc7b3
                        type: paymentMethods
                        attributes:
                          name: Credit Card
                          paymentProvider: stripe
                          providerAttributes:
                            publishableKey: pk_4ef3a2a7-950f-5c97-bdf3-e6606455540f
                          supportsPayLater: true
                          enabledFor:
                            - externalBookings
                            - dropInPasses
                            - publicEventTickets
  /spaces/{spaceId}/external_resources:
