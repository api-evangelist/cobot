    space_profile:
      id: space_profile.json#
      type: object
      required:
        - data
      additionalProperties: false
      properties:
        data:
          type: object
          required:
            - id
            - type
          additionalProperties: false
          properties:
            id:
              type: string
            type:
              type: string
              pattern: spaceProfiles
            attributes:
              type: object
              additionalProperties: false
              properties:
                location:
                  oneOf:
                    - type: 'null'
                    - type: string
                  description: Free-form location string.
                structuredAddress:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/invoiceAddress'
                  description: Structured address when available; null otherwise.
                phone:
                  oneOf:
                    - type: 'null'
                    - type: string
                contactEmail:
                  oneOf:
                    - type: 'null'
                    - type: string
                      format: email
                externalLinks:
                  type: array
                  items:
                    type: object
                    required:
                      - url
                      - type
                    additionalProperties: false
                    properties:
                      url:
                        type: string
                        format: uri-reference
                      type:
                        type: string
                        enum:
                          - website
                          - yelp
                          - facebook
                          - googleMaps
                          - instagram
                          - twitter
                          - linkedin
                openStatus:
                  type: object
                  additionalProperties: false
                  properties:
                    status:
                      oneOf:
                        - type: 'null'
                        - type: string
                          enum:
                            - open
                            - membersOnly
                            - closed
                    additionalInformation:
                      oneOf:
                        - type: 'null'
                        - type: string
                openHours:
                  type: array
                  description: Active opening hours only. Days without hours are omitted.
                  items:
                    type: object
                    required:
                      - weekday
                      - from
                      - to
                    additionalProperties: false
                    properties:
                      weekday:
                        type: integer
                        minimum: 1
                        maximum: 7
                        description: 1 is Monday, 7 is Sunday (ISO 8601).
                      from:
                        oneOf:
                          - type: 'null'
                          - type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        description: Opening time in the space's time zone, 24h format.
                      to:
                        oneOf:
                          - type: 'null'
                          - type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        description: Closing time in the space's time zone, 24h format.
            relationships:
              type: object
              additionalProperties: false
              properties:
                space:
                  type: object
