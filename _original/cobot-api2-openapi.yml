  /spaces/{spaceId}/bookings:
    get:
      summary: List space bookings
      description: |
        List all the bookings for a space in the given time.

        **Access**: The current user must be an admin or member of the space. If the
        space is part of a network, the user must be an admin or member of any
        space in the network.
      operationId: get-space-bookings
      parameters:
        - name: spaceId
          in: path
          required: true
          description: The id of the space the bookings belong to.
          schema:
            type: string
        - name: filter[from]
          in: query
          required: true
          description: Start of the time range.
          schema:
            type: string
            format: date-time
          example: '2012-04-12T10:00:00Z'
        - name: filter[to]
          in: query
          required: true
          description: End of the time range.
          schema:
            type: string
            format: date-time
          example: '2012-04-12T18:00:00Z'
        - name: include
          in: query
          required: false
          style: form
          explode: false
          description: |
            List of related resources to include in response. 
            Provide a comma separated list of relationship names. When requesting 
            events, the access token needs the read_events scope. When requesting
            external bookings, the access token needs the read_external_bookings
            scope.
          schema:
            type: array
            items:
              type: string
              enum:
                - membership
                - event
                - externalBooking
      security:
        - OAuth2:
            - read_bookings
            - read_events
            - read_external_bookings
      tags:
        - Booking
      responses:
        '200':
          description: Bookings of a space for a given time range.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/bookings'
              examples:
                default:
                  value:
                    data:
                      - id: b8f21a71ac8df98d29de357180d27358
                        type: bookings
                        attributes:
                          from: '2018-01-01T12:00:00Z'
                          to: '2018-01-01T14:00:00Z'
