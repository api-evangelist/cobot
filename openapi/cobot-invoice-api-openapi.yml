  /spaces/{spaceId}/invoices:
    get:
      summary: List
      description: 'List the invoices issued by a space:


        * all invoices in a given time (pass `filter[to/from]`)

        * for a single membership or team (pass `filter[debitorId]`)

        * all invoices with a specific paid status (pass `filter[paidStatus]`)


        **Access**: The current user must be an admin of the space where

        the invoice was created. If the space is part of a network,

        the user must be an admin of any space in the network.

        '
      operationId: get-space-invoices
      security:
      - OAuth2:
        - read_invoices
      tags:
      - Invoice
      parameters:
      - name: spaceId
        in: path
        required: true
        description: The id of the space the invoices belong to.
        schema:
          type: string
      - name: filter[debitorId]
        in: query
        required: false
        description: To list invoices that belong to a single debitor (membership or team), pass the id of that membership or team.
        schema:
          type: string
      - name: filter[membershipId]
        in: query
        required: false
        description: Same as `filter[debitorId]`, left for backward compatibility. Will be deprecated.
        schema:
          type: string
      - name: filter[from]
        in: query
        required: false
        description: List invoices for all debitors whose invoice date is within the given timespan.
        schema:
          type: string
          format: date
      - name: filter[to]
        in: query
        required: false
        description: List invoices for all debitors whose invoice date is within the given timespan.
        schema:
          type: string
          format: date
      - name: filter[dateFilterField]
        in: query
        required: false
        description: "What field to use for filtering the invoices by date.\n* When using `invoiceDate` (default), invoices are filtered based on the date the\n  invoice was generated (this respects when invoices are generated before their due date).\n* When using `dueDate`, invoices are filtered based on their due date\n  (disregarding that invoices might be generated before their due date).\n* When using `remindAt`, invoices are filtered based on the date the invoice's reminder is due. Only unpaid invoices are included.\n"
        schema:
          type: string
          enum:
          - dueDate
          - invoiceDate
          - remindAt
      - name: filter[paidStatus]
        in: query
        required: false
        description: 'Filter the invoices by their paid status. Can not be combined with any of the other filters.

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - unpaid
            - paid
            - writtenOff
            - pending
          style: form
          explode: false
      responses:
        '200':
          description: 'Returns a list of invoice for the given space or a debitor (membership or team) in the space. When a space

            is part of a network, its members can have invoices in other spaces of the network.

            '
