                      additionalProperties: false
                      properties:
                        publishableKey:
                          description: Needed to render a Stripe.JS form.
                          type: string
                    - type: object
                      required:
                      - clientId
                      - merchantId
                      additionalProperties: false
                      properties:
                        clientId:
                          description: Needed to render a paypal button.
                          type: string
                        merchantId:
                          description: Space-specific, needed to render a paypal button.
                          type: string
                  supportsPayLater:
                    description: Can be used to create a payment, then update and charge it later.
                    type: boolean
              relationships:
                type: object
                required:
                - space
                additionalProperties: false
                properties:
