  /spaces/{spaceId}/invoice_previews:
    get:
      summary: Previews
      description: 'List the previews of the invoices that will be generated in a space

        for a timespan.


        **Access**: The current user must be an admin of the space where

        the invoice is created.

        '
      operationId: get-space-membership-invoice-previews
      security:
      - OAuth2:
        - read_invoices
      tags:
      - Invoice
      parameters:
      - name: spaceId
        in: path
        required: true
        description: The id of the space the invoices belong to.
        schema:
          type: string
      - name: filter[from]
        in: query
        required: true
        description: The start of the timespan to list previews for. Must be today or in the future.
        schema:
          type: string
          format: date
      - name: filter[to]
        in: query
        required: true
        description: The end of the timespan to list previews for.
        schema:
          type: string
          format: date
      - name: filter[dateFilterField]
        in: query
        required: false
        description: "What field to use for filtering the invoice previews by date.\n* When using `invoiceDate` (default), previews are filtered based on the date the\ninvoice would be generated (this respects when invoices are generated before their due date).\n* When using `dueDate`, previews are filtered based on the due date of the future invoice\n  (disregarding that invoices might be generated before their due date).\n"
        schema:
          type: string
          enum:
          - dueDate
          - invoiceDate
      responses:
        '200':
          description: 'Returns a list of invoice previews. The schema is the same as for invoices.


            For performance reasons, invoice previews are limited to 10 per page. In

            addition, no `totalPages` is returned in the pagination meta section and

            no `last` link is returned. Clients have to keep requesting the `next` link

            until it is `null`.

            '
