          - area
          - areaPreferredUnit
          - costCenter
          - revenueAccount
          - bookingTimes
          - bookingTimesString
          - canBook
          - bookingCutoff
          - cancellationPeriod
          - capacity
          - color
          - description
          - hidden
          - maxBookingDuration
          - minBookingDuration
          - name
          - onlyAdminsCanBook
          - photo
          - pricing
          - resourceType
          - units
          - usage
          additionalProperties: false
          properties:
            name:
              type: string
            resourceType:
              $ref: '#/components/schemas/resourceType'
            usage:
