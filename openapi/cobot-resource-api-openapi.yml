              type: integer
              minimum: 1
            capacity:
              description: How many people can fit inside
              oneOf:
              - type: integer
              - type: 'null'
            cancellationPeriod:
              description: This limits how many hours in advance of a booking's start time it can still be edited or canceled by members.
              type: integer
            bookingCutoff:
              description: This limits how many hours in advance of a booking's start time it can be made by members.
              type: integer
            minBookingDuration:
              type: integer
            maxBookingDuration:
              oneOf:
              - type: 'null'
              - type: integer
            color:
              $ref: '#/components/schemas/color'
            photo:
              oneOf:
              - type: 'null'
              - type: object
                properties:
                  icon:
                    $ref: '#/components/schemas/photo'
                  default:
                    $ref: '#/components/schemas/photo'
                  small:
                    $ref: '#/components/schemas/photo'
                  medium:
                    $ref: '#/components/schemas/photo'
                  large:
                    $ref: '#/components/schemas/photo'
                additionalProperties: false
            bookingTimes:
              $ref: '#/components/schemas/bookingTimes'
            bookingTimesString:
              oneOf:
              - type: 'null'
              - type: string
        relationships:
          type: object
          additionalProperties: false
          required:
