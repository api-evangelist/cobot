            resourceAvailability:
              $ref: '#/components/schemas/related-link'
            space:
              $ref: '#/components/schemas/relationship-linkage'
            products:
              $ref: '#/components/schemas/relationship-linkage-array'
      definitions:
        resourceType:
          oneOf:
          - type: 'null'
