components:
  schemas:
    positive-decimal:
      description: A positive decimal number (>= 0).
      type: string
      pattern: ^\d+(\.\d+)?$
    price:
      description: Price including net/gross value and all taxes.
      type: object
      required:
      - net
      - gross
      - currency
      - taxes
      additionalProperties: false
      properties:
        net:
          $ref: '#/components/schemas/decimal'
        gross:
          $ref: '#/components/schemas/decimal'
        currency:
          $ref: '#/components/schemas/currency'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/tax'
    related-link:
      type: object
      required:
      - links
      additionalProperties: false
      properties:
        links:
          type: object
          required:
          - related
          additionalProperties: false
          properties:
            related:
              type: string
              format: uri-reference
    bookingTimesString:
      description: When (weekdays, times) the resource can be booked. See the resource form in the admin section for the format.
      type:
      - 'null'
      - string
    resource-price-cap:
      type: object
      required:
      - price
      - maximumDuration
      additionalProperties: false
      properties:
        price:
          $ref: '#/components/schemas/price'
        maximumDuration:
          $ref: '#/components/schemas/hours-minutes-object'
    onlyAdminsCanBook:
      description: Resource can be seen by members but not booked.
      type: boolean
    capacity:
      description: How many people can fit inside
      type:
      - 'null'
      - integer
    data:
      type: object
      required:
      - id
      - type
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - resourceAvailabilities
        attributes:
          type: object
          required:
          - availableTimes
          additionalProperties: false
          properties:
            availableTimes:
              type: array
              items:
                type: object
                required:
                - from
                - to
                additionalProperties: false
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
        relationships:
          type: object
          additionalProperties: false
          properties:
            resource:
              $ref: '#/components/schemas/relationship-linkage'
    hidden:
      description: Resource is hidden from members. Only admins can see it.
      type: boolean
    resourceType:
      oneOf:
      - type: 'null'
      - type: string
        enum:
        - room
        - desk
        - other
    pagination-meta:
      type: object
      additionalProperties: false
      properties:
        totalPages:
          type: number
        currentPage:
          type: number
    color:
      description: 'Color hex code, e.g. #FF0000'
      type: string
      pattern: ^#[a-fA-F0-9]{6}$
    priceCaps:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - price
        - maximumDuration
        properties:
          price:
            $ref: '#/components/schemas/positive-money'
          maximumDuration:
            $ref: '#/components/schemas/hours-minutes-object'
    pricing:
      description: A pricing object, containing all pricing information for a given resource.
      required:
      - currency
      - pricePerHour
      - discounts
      - priceCap
      - priceCaps
      - taxes
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        pricePerHour:
          $ref: '#/components/schemas/price'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/resource-discount'
        priceCaps:
          type: array
          items:
            $ref: '#/components/schemas/resource-price-cap'
        priceCap:
          description: Only charges for the booking up to the given duration.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/resource-paid-time-cap'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/tax'
        fixedRates:
          description: When set, regular price, discounts, price caps etc are ignored.
          type: array
          items:
            $ref: '#/components/schemas/fixed-rate'
      additionalProperties: false
    fixedRates:
      type: array
      description: When set, regular price, discounts, price caps etc are ignored.
      items:
        $ref: '#/components/schemas/fixed-rate'
    description:
      type:
      - string
      - 'null'
    currency:
      description: ISO 4217 3 letter currency code.
      type: string
      pattern: ^[A-Z]{3}$
    photo-2:
      oneOf:
      - type: 'null'
      - $ref: '#/components/schemas/image-upload'
    photo:
      type: object
      properties:
        url:
          type: string
          format: uri-reference
        width:
          type: number
        height:
          type: number
      additionalProperties: false
    resource-availability:
      id: resource-availability.json#
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: object
          required:
          - id
          - type
          additionalProperties: false
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - resourceAvailabilities
            attributes:
              type: object
              required:
              - availableTimes
              additionalProperties: false
              properties:
                availableTimes:
                  type: array
                  items:
                    type: object
                    required:
                    - from
                    - to
                    additionalProperties: false
                    properties:
                      from:
                        type: string
                        format: date-time
                      to:
                        type: string
                        format: date-time
            relationships:
              type: object
              additionalProperties: false
              properties:
                resource:
                  $ref: '#/components/schemas/relationship-linkage'
    bookingCutoff:
      description: This limits how many hours in advance of a booking's start time it can be made by members.
      oneOf:
      - type: 'null'
      - type: integer
        default: 0
    update-resource:
      id: update-resource.json#
      type: object
      required:
