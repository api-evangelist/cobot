                          to: '16:00'
                          weekdays:
                          - 1
                          - 2
                        bookingsRequireApproval: true
                        payLater: false
                      relationships:
                        space:
                          data:
                            id: a927aa71ac8df98d29de357180d275a2
                            type: spaces
                        resource:
                          data:
                            id: 34e3ccee-4eb1-5b1d-b625-5bb34cefe28e
