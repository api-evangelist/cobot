                            taxes:
                            - name: Tax
                              rate: '20.0'
                              amount: '2.0'
                          priceCap:
                            maximumDuration:
                              hours: 12
                              minutes: 30
                          discounts:
                          - pricePerHour:
                              net: '5.0'
                              gross: '6.0'
                              currency: EUR
                              taxes:
                              - name: Tax
                                rate: '20.0'
