                          number: MR1
                        revenueAccount:
                          name: External Bookings
                          number: '4000'
                        pricing:
                          currency: EUR
                          taxes:
                          - name: Tax
                            rate: '20.0'
                          pricePerHour:
                            net: '10.0'
                            gross: '12.0'
                            currency: EUR
                            taxes:
                            - name: Tax
                              rate: '20.0'
                              amount: '2.0'
                          priceCap:
                            maximumDuration:
                              hours: 12
                              minutes: 30
                          discounts:
                          - pricePerHour:
                              net: '5.0'
                              gross: '6.0'
                              currency: EUR
                              taxes:
                              - name: Tax
                                rate: '20.0'
                                amount: '1.0'
                            minimumDuration:
                              hours: 2
                              minutes: 0
                          priceCaps:
                          - price:
                              net: '50.0'
                              gross: '60.0'
                              currency: EUR
                              taxes:
                              - name: Tax
                                rate: '20.0'
                                amount: '10.0'
                            maximumDuration:
                              hours: 8
                              minutes: 30
                        description: Meeting Room
                        instructions: Ring the bell and wait for the door to be opened.
                        cancellationPeriod: 120
                        bookingCutoff: 1
                        effectiveBookingCutoff: 1
                        minBookingDuration: 60
                        maxBookingDuration: 480
                        capacity: 1
                        area:
