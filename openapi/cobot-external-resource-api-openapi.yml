              examples:
                default:
                  value:
                    data:
                      id: a4a99a71ac8df98d29de357180d273d3
                      type: externalResources
                      attributes:
                        name: Meeting Room
                        resourceType: room
                        accountingCode: EXTR
                        costCenter:
