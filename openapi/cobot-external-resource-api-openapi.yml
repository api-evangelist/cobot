                        resourceType: room
                        accountingCode: EXTR
                        costCenter:
                          name: External Bookings
                          number: MR1
                        revenueAccount:
                          name: External Bookings
                          number: '4000'
                        pricing:
                          currency: EUR
                          taxes:
                          - name: Tax
                            rate: '20.0'
                          pricePerHour:
