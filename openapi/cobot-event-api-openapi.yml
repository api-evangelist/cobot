  /spaces/{spaceId}/events/tags:
    get:
      summary: List Tags
      description: 'List the most popular tags used when creating events. Returns tags for events

        with the start or end date within specified time range (last 365 days by default).

        **Access**: The current user must be an admin or member of the space. If the

        space is part of a network, the user must be an admin or member of any

        space in the network.

        '
      operationId: list-event-tags
      security:
      - OAuth2:
        - read_events
      tags:
      - Event
      parameters:
      - name: spaceId
        in: path
        required: true
        description: The id of the space to get the event tags for.
        schema:
          type: string
      - name: filter[from]
        in: query
        required: false
        description: The start of the time range. If omitted, 12 months ago.
        schema:
          type: string
          format: date-time
        example: '2012-01-01T00:00:00Z'
      - name: filter[to]
        in: query
        required: false
        description: The end of the time range. If omitted, now.
        schema:
          type: string
          format: date-time
        example: '2012-06-30T23:59:59Z'
      responses:
        '200':
          description: A list of the 20 most popular tags used for events in the space.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/event-tags'
              examples:
                default:
                  value:
                    data:
                    - id: 28ef9e2617065920faa4b39892645121
                      type: eventTags
                      attributes:
                        name: Party
