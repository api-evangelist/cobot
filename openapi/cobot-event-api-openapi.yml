  /spaces/{spaceId}/events:
    get:
      summary: List events
      description: 'List/filter events for a time range.

        **Access**: Any user can see the list of events. Only admins of the space can see draft events.

        '
      operationId: list-events
      security:
      - OAuth2:
        - read_events
      tags:
      - Event
      parameters:
      - name: spaceId
        in: path
        required: true
        description: The id of the space to get the events for.
        schema:
          type: string
      - name: include
        in: query
        required: false
        description: 'List of related resources to include in response as comma separated string.


          Including `attendances.attendee` will also return `attendances`.

          A maximum of 5 attendances per event is returned. If the current user is attending,

          their attendance will be included in the 5. The full count is returned in the meta section.


          Including `attendances` requires the `read_event_attendances` scope.

          Including `attendances.attendee` requires the `read_event_attendances` and `read_memberships` scopes.

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - attendances
            - attendances.attendee
      - name: filter[from]
        in: query
        required: true
        description: The start of the time range.
        schema:
          type: string
          format: date-time
        example: '2012-04-12T10:00:00Z'
      - name: filter[to]
        in: query
        required: true
        description: The end of the time range.
        schema:
          type: string
          format: date-time
        example: '2012-04-30T23:59:59Z'
      - name: filter[publishedState]
        in: query
        example: draft,published
        required: true
        style: form
        explode: false
        description: 'Return draft/published events. Pass a comma separated list of states.

          Only admins can request draft events.

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - published
      - name: filter[tags]
        in: query
        required: false
        description: 'Comma separated list of tags to filter events by.

          To include events with no tags pass an empty

          tag (alone: `filter[tags]=`, with other tags: `filter[tags]=tag1,,tag2`).

          When this parameter is left out, events with any or no tags are returned.

          '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
        example: party,free
      - name: filter[resourceIds]
        in: query
        required: false
        style: form
        explode: false
        description: 'Filter events by the resources they use (list of resource ids separated by commas).

          To include events with no resources pass an empty resource id

          (alone: `filter[resourceIds]=`, with other ids: `filter[resourceIds]=r1,,r2`).

          When this parameter is left out, events with any or no resources are returned.

          '
        schema:
          type: array
          items:
            type: string
        example: a4a99a71ac8df98d29de357180d273d3,13b73f71ac8df98129de357180d219a6
      - name: filter[attendeeIds]
        in: query
        required: false
        style: form
        explode: false
        description: Filter events by who is attending. Pass a comma separated list of ids (for now only membership ids).
        schema:
          type: array
          items:
            type: string
        example: c2a99a71ac8df98d29de357180d273d2,9a673f71ac8df98129de357180d219a8
      - name: filter[sortOrder]
        in: query
        required: false
        description: Whether to sort events by date ascending or descending.
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Event list according to search filter.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/events'
              examples:
                default:
                  value:
                    data:
                    - id: b8f21a71ac8df98d29de357180d27358
                      type: events
                      attributes:
                        from: '2018-01-01T12:00:00Z'
                        to: '2018-01-01T14:00:00Z'
                        title: launch party
                        price:
                          net: '10.0'
                          gross: '12.0'
                          currency: EUR
                          taxes:
                          - rate: '20.0'
                            name: Tax
                        visitorPrice: null
                        expectedRevenue:
                        - net: '10.0'
                          gross: '12.0'
                          currency: EUR
                          taxes:
                          - rate: '20.0'
                            name: Tax
                        audience: membersOnly
                        color: '#FF0000'
                        accountingCode: EVT
                        visitorAccountingCode: null
                        costCenter:
                          name: Events Revenue
                          number: E17
                        revenueAccount:
                          name: Events Revenue
                          number: '4000'
                        visitorCostCenter: null
                        visitorRevenueAccount: null
