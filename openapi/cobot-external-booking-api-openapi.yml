  /spaces/{spaceId}/external_bookings:
    get:
      summary: List for space
      description: 'List a space''s external bookings for a given timespan.

        The bookings are filtered by their `from` attribute, not by testing for overlap.


        **Access**: The current user must be an admin of the space.

        '
      operationId: get-space-external-bookings
      parameters:
      - name: spaceId
        in: path
        required: true
        description: The id of the space to get the bookings for.
        schema:
          type: string
      - name: filter[from]
        in: query
        required: true
        description: The start of the time range to return external bookings for.
        schema:
          type: string
          format: date-time
        example: '2012-04-12T10:00:00Z'
      - name: filter[to]
        in: query
        required: true
        description: The end of the time range to return external bookings for.
        schema:
          type: string
          format: date-time
        example: '2012-04-14T20:00:00Z'
      - name: filter[sortOrder]
        in: query
        required: false
        description: Whether to sort external bookings by date ascending or descending date.
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      - name: include
        in: query
        required: false
        description: 'List of related resources to include in response. Provide a comma separated list of relationship names.

          `invoices` requires the `read_invoices` scope.

          '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - invoices
      security:
      - OAuth2:
        - read_external_bookings
        - read_invoices
      tags:
      - External Booking
      responses:
        '200':
          description: The external bookings for the given space and time frame.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/external-bookings'
              examples:
                default:
                  value:
                    data:
                    - id: b8f21a71ac8df98d29de357180d27358
                      type: externalBookings
                      attributes:
                        from: '2018-01-01T12:00:00Z'
                        to: '2018-01-01T14:00:00Z'
                        title: Company Retreat
                        price:
                          net: '10.0'
                          gross: '11.0'
                          currency: EUR
                          taxes:
                          - rate: '10.0'
                            amount: '1.0'
                            name: VAT
                        totalPrice:
                          net: '11.0'
                          gross: '12.1'
                          currency: EUR
                          taxes:
                          - rate: '10.0'
                            amount: '1.1'
                            name: VAT
                        numberOfVisitors: 1
                        acceptedTerms: true
                        name: Earl McBride
                        company: ACME Inc.
                        billingAddress: 1422 Nuede Extension\nSpringfield, IL, 12345
                        structuredBillingAddress:
                          name: Earl McBride
                          company: ACME Inc.
                          fullAddress: 1422 Nuede Extension\nSpringfield, IL, 12345
                          street: 1422 Nuede Extension
                          postCode: '12345'
                          city: Springfield
