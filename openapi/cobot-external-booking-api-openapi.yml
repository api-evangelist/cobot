              properties:
                fullPrice:
                  description: Price of the booking, without any of the applied* attributes applied, and without booking extras and discount.
                  $ref: '#/components/schemas/price'
                finalPrice:
                  description: Price of the booking, with the applied* attributes applied, and without booking extras and discount.
                  $ref: '#/components/schemas/price'
                totalPrice:
                  description: Price of the booking with the applied* attributes applied, and including booking extras and an optional discount code.
                  $ref: '#/components/schemas/price'
                appliedFixedRates:
                  type: array
                  items:
                    $ref: '#/components/schemas/fixed-rate-count'
                appliedDiscounts:
                  type: array
                  items:
                    $ref: '#/components/schemas/resource-discount'
                appliedPriceCaps:
                  type: array
                  items:
                    $ref: '#/components/schemas/resource-price-cap'
                appliedPriceCap:
                  oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/resource-paid-time-cap'
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                bookingExtras:
