                          net: '10.0'
                          gross: '11.0'
                          currency: EUR
                          taxes:
                          - rate: '10.0'
                            amount: '1.0'
                            name: VAT
                        totalPrice:
                          net: '11.0'
                          gross: '12.1'
                          currency: EUR
                          taxes:
                          - rate: '10.0'
                            amount: '1.1'
                            name: VAT
                        numberOfVisitors: 1
                        acceptedTerms: true
                        name: Earl McBride
                        company: ACME Inc.
                        billingAddress: 1422 Nuede Extension\nSpringfield, IL, 12345
                        structuredBillingAddress:
                          name: Earl McBride
                          company: ACME Inc.
                          fullAddress: 1422 Nuede Extension\nSpringfield, IL, 12345
                          street: 1422 Nuede Extension
