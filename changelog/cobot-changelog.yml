observations:
- >-
  Additive-by-default. Across the recent window only one entry (2020-11-19) changes existing
  behavior, and it widens a response code rather than removing anything.
- >-
  No sunset or deprecation entries appear in the log at all, which is consistent with API 1 still
  being live years after API 2 shipped.
- >-
  API 2 is the actively developed surface but has no dated change log, so a consumer of the
  current API has no way to see what changed between two dates. That is the single biggest gap
  in an otherwise strong change-communication posture.
