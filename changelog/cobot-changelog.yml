summary: >-
  Cobot publishes a single dated API change log covering the LEGACY v1 API, running from 2012 to
  2024 — 207 dated entries. It is a genuine, long-lived changelog and each entry names the exact
  attribute or endpoint that changed. Two caveats a reader should not miss: the most recent entry
  is 2024-07-25, and the log describes API 1 only. There is no published change log for API 2,
  whose OpenAPI carries a flat info.version of 2.0 with no dated history.
scheme:
  versioning: major-version-per-surface (API 1, API 2)
  current_version: '2.0'
  current_version_source: openapi/cobot-api2-openapi.yml (info.version)
  changelog_covers: API 1 (legacy)
  changelog_for_api_2: none published
  format: dated entries, newest first, on a single HTML page
  feed: none (no RSS/Atom, no JSON)
